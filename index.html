<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팁 계산기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<header class="topbar">
  <h1>💰 팁 계산기</h1>
  <div class="date-row">
    <label for="dateInput">날짜</label>
    <input type="date" id="dateInput">
    <button id="resetDayBtn" class="btn btn-ghost" type="button">오늘 입력 지우기</button>
  </div>
  <p class="top-hint">팁 총액을 넣고, 일한 사람을 누르면 끝이에요.</p>
</header>

<main>
  <section class="card" id="rosterCard">
    <h2>직원 명단</h2>
    <div id="rosterList"></div>
    <form id="addPersonForm" class="add-row">
      <input id="newName" type="text" placeholder="이름 입력" autocomplete="off">
      <select id="newRole" aria-label="역할">
        <option value="server">서버</option>
        <option value="kitchen">주방</option>
      </select>
      <button class="btn btn-primary" type="submit">추가</button>
    </form>
    <p class="hint">주방은 그 시프트 팁 전체의 10%를 먼저 나눠 가져요.</p>
  </section>

  <section class="card shift-card" id="shift-am"></section>
  <section class="card shift-card" id="shift-pm"></section>

  <section class="card" id="resultCard">
    <h2>오늘 정산</h2>
    <div id="resultBody"></div>
  </section>
</main>

<script src="js/calc.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
